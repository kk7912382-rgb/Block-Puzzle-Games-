name: Build APK and AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK & AAB
      run: |
        chmod +x gradlew || true
        ./gradlew assembleRelease bundleRelease || ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BlockPuzzle-APK
        path: app/build/outputs/apk/**/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: BlockPuzzle-AAB
        path: app/build/outputs/bundle/**/*.aab
